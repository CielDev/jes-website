<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Map | Just an Earth Server</title>
<meta name="description" content="The Just an Earth Server live map: a 3D globe and flat map with towns, claims and live player positions.">
<link rel="icon" type="image/png" href="../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Minecraft";src:url("../fonts/MinecraftClassic-Bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Minecraftia";src:url("../fonts/Minecraftia-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
:root{--bg:#05050a;--bg2:#15121d;--panel:rgba(21,18,29,.94);--line:#2a2536;--text:#f3f0f7;--muted:#a39db3;--pink:#E43A96;--gold:#FCD05C;--grad:linear-gradient(90deg,var(--pink),var(--gold));--navh:64px;--top:var(--navh)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Outfit",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* top bar, same as the main site */
nav{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(13,11,18,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:transform .3s}
nav .wrap{display:flex;align-items:center;gap:28px;height:var(--navh);max-width:1600px;margin:0 auto;padding:0 24px}
body.nonav nav{transform:translateY(-100%)}
body.nonav{--top:0px}
.brand{display:flex;align-items:center}
.brand img{height:44px;width:auto;display:block}
.links{display:flex;gap:24px;align-items:center;margin-left:16px;font-size:16px;color:var(--muted)}
.links a:hover,.dd>button:hover{color:var(--text)}
.links a.on{color:var(--text)}
.dd{position:relative}
.dd>button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:1px 6px}
.dd ul{display:none;position:absolute;top:100%;left:-12px;list-style:none;padding:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;min-width:180px}
.dd:hover ul,.dd:focus-within ul{display:block}
.dd li a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:6px}
.dd li a:hover{background:var(--line);color:var(--text)}
.ext{opacity:.7;flex:none}
.right{margin-left:auto;display:flex;align-items:center;gap:24px;font-size:16px;color:var(--muted)}
#online{background:none;border:0;cursor:pointer;color:inherit;font-size:16px;padding:8px 0}
#online:hover{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:.2em 26px 0;border:0;border-radius:12px;background:var(--grad);color:#1a1020;font-family:"Minecraft","Outfit",sans-serif;font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;line-height:1;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3);transition:transform .15s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn.store{display:none}

/* mobile menu, same as the main site */
.burger,#scrim,#drawer{display:none}
.burger{flex:none;flex-direction:column;justify-content:center;gap:6px;width:44px;height:44px;margin-left:-8px;padding:8px;background:none;border:0;cursor:pointer}
.burger i{display:block;width:100%;height:2px;border-radius:1px;background:var(--text)}
#scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .28s}
#drawer{position:fixed;top:0;bottom:0;left:0;z-index:26;width:min(82vw,320px);padding:12px 12px 24px;overflow-y:auto;background:var(--bg2);border-right:1px solid var(--line);transform:translateX(-100%);visibility:hidden;transition:transform .28s ease,visibility .28s}
body.menu #scrim{opacity:1;pointer-events:auto}
body.menu #drawer{transform:none;visibility:visible}
.dr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-left:8px}
.dr-top img{height:34px;width:auto;display:block}
.dr-close{display:grid;place-items:center;width:44px;height:44px;background:none;border:0;color:var(--text);cursor:pointer}
#drawer>a,.dr-sub{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:0 8px;border:0;border-radius:8px;background:none;color:var(--text);font:inherit;font-size:18px;font-weight:500;text-align:left;cursor:pointer}
.dr-sub svg{color:var(--muted);transition:transform .25s}
.dr-sub[aria-expanded="true"] svg{transform:rotate(90deg)}
.dr-more{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .25s ease,visibility .25s}
.dr-sub[aria-expanded="true"]+.dr-more{grid-template-rows:1fr;visibility:visible}
.dr-more ul{min-height:0;overflow:hidden;list-style:none;padding:0}
.dr-more a{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 8px 0 20px;color:var(--muted);font-size:17px}

/* map */
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing}
#markers{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#markers>div{position:absolute;left:0;top:0;will-change:transform}

/* players: just a head from far away, a name plate up close */
.pl{display:flex;align-items:center;padding:2px;border-radius:3px;background:#0d0b12;transform-origin:0 0;pointer-events:auto;cursor:pointer;white-space:nowrap;z-index:2;transition:padding .3s ease,border-radius .3s ease}
.pl img,.pl i{width:20px;height:20px;flex:none;display:block;image-rendering:pixelated;background:var(--line)}
.pl span{max-width:0;margin-left:0;overflow:hidden;opacity:0;font-size:12.5px;font-weight:600;line-height:16px;transition:max-width .3s ease,margin .3s ease,opacity .25s ease}
.pl.near{padding-right:8px;border-radius:4px}
.pl.near span{max-width:200px;margin-left:7px;opacity:1}
.pl:hover{z-index:3}
#markers .ghost{pointer-events:none;z-index:0}

/* landmarks, animals and birds */
.sg{pointer-events:auto;z-index:1}
.sg img{display:block;image-rendering:pixelated;filter:drop-shadow(1px 0 0 rgba(255,255,255,.55)) drop-shadow(-1px 0 0 rgba(255,255,255,.55)) drop-shadow(0 1px 0 rgba(255,255,255,.55)) drop-shadow(0 -1px 0 rgba(255,255,255,.55)) drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.bird{width:21px;height:9px;background-size:42px 9px;image-rendering:pixelated;pointer-events:none;animation:flap .45s steps(2) infinite;filter:drop-shadow(0 2px 1px rgba(0,0,0,.5))}
@keyframes flap{to{background-position:-42px 0}}
.flyer{pointer-events:auto;z-index:3}
.flyer img{display:block;image-rendering:pixelated;filter:drop-shadow(0 2px 2px rgba(0,0,0,.55))}
.spark{width:4px;height:4px;border-radius:1px;background:#fff;box-shadow:0 0 6px 1px rgba(255,210,120,.9);pointer-events:none;z-index:2}

/* the wooden warning sign */
.sign{pointer-events:auto;z-index:2;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.sign b{display:block;width:104px;padding:6px 6px 5px;background:#a2793f;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 7px),linear-gradient(90deg,rgba(255,255,255,.05),rgba(0,0,0,.08));border:3px solid #6b4a22;font:400 8px/1.5 "Minecraftia",monospace;color:#1d140a;text-align:center;white-space:pre-line;image-rendering:pixelated}
.sign i{display:block;width:8px;height:22px;background:#6b4a22;border-left:2px solid #835c2c}

/* the end of the world */
body.doom nav,body.doom .ctl,body.doom #markers,body.doom #pop,body.doom #list,body.doom #coords,body.doom #status{opacity:0;pointer-events:none;transition:opacity 1.2s}
#doom,#debris{position:fixed;inset:0;pointer-events:none;display:none;overflow:hidden}
#doom{z-index:41}
#debris{z-index:40}
body.doom #doom,body.doom #debris{display:block}
#debris>*{position:absolute;left:0;top:0;will-change:transform,opacity;white-space:nowrap}
#debris img{width:22px;height:22px;image-rendering:pixelated;border-radius:3px;box-shadow:0 0 12px rgba(255,140,60,.55)}
#debris span{font-size:12px;font-weight:600;color:#f3e9dc;text-shadow:0 0 8px rgba(255,120,40,.8),0 1px 2px #000}
#doom .bar{position:absolute;left:0;right:0;height:0;background:#000;transition:height 1.6s cubic-bezier(.7,0,.2,1)}
#doom .bar.t{top:0}
#doom .bar.b{bottom:0}
body.cine #doom .bar{height:11vh}
#doom .flash{position:absolute;inset:0;background:radial-gradient(circle at 55% 42%,#fff 0,#ffe6c0 35%,#ff9a50 100%);opacity:0}
#doom .say{position:absolute;left:16px;right:16px;bottom:calc(11vh + 26px);text-align:center;font:700 clamp(15px,1.9vw,22px)/1.4 "Minecraft",system-ui,sans-serif;letter-spacing:.06em;color:#ece6f4;text-shadow:0 2px 14px #000;opacity:0;transition:opacity 1.4s}
#doom .title{position:absolute;left:16px;right:16px;top:44%;transform:translateY(-50%);text-align:center;font:700 clamp(30px,6.2vw,80px)/1.15 "Minecraft",system-ui,sans-serif;letter-spacing:.05em;background:linear-gradient(90deg,#ff7a3c,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 34px rgba(228,58,150,.5));opacity:0;transition:opacity 3s,letter-spacing 10s cubic-bezier(.2,.7,.2,1)}
#doom .title.on{letter-spacing:.13em}
#doom .rebuild{position:absolute;left:50%;bottom:calc(5.5vh - 22px);transform:translateX(-50%);pointer-events:auto;opacity:0;transition:opacity 1.4s,transform .15s}
#doom .rebuild:hover{transform:translate(-50%,-2px)}
#doom .on{opacity:1}

/* towns */
.tw{display:flex;align-items:center;gap:4px;pointer-events:auto;cursor:pointer;z-index:1}
.tw svg{width:14px;height:14px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
.tw b{display:block;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.tw span{display:none;font-size:12px;font-weight:600;text-shadow:0 1px 2px #000,0 0 4px #000}
.tw.near span{display:block}
.tw.dot:not(.near){display:none}

/* controls, top right and bottom right */
.ctl{position:fixed;right:clamp(12px,2.4vw,32px);z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#layersBtn{top:calc(var(--top) + 16px);width:44px;height:44px;display:grid;place-items:center;cursor:pointer;transition:top .3s}
#layersBtn[hidden]{display:none}
#layersBtn svg{width:20px;height:20px}
#layersBtn:hover,#zoom button:hover{background:var(--line)}
#panel{top:calc(var(--top) + 16px);width:200px;padding:12px;transition:top .3s}
#panel[hidden]{display:none}
.ph{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px 2px;font-size:14px}
.ph button{background:none;border:0;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px}
.ph button:hover{color:var(--text)}
.tg{display:flex;align-items:center;gap:10px;padding:7px 2px;font-size:14px;cursor:pointer;user-select:none}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg i{position:relative;width:32px;height:18px;flex:none;border-radius:9px;background:#3a3446;transition:background .2s}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.tg input:checked+i{background:var(--pink)}
.tg input:checked+i::after{transform:translateX(14px)}
.tg input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}
.tg em{margin-left:auto;font-style:normal;color:var(--muted);font-size:13px}
#zoom{bottom:calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}
#zoom button{width:44px;height:42px;border:0;background:none;cursor:pointer;font-size:20px;line-height:1}
#zoom button+button{border-top:1px solid var(--line)}

/* player list */
#list{position:fixed;top:calc(var(--top) + 8px);right:clamp(12px,2.4vw,32px);z-index:16;width:240px;max-height:min(60vh,460px);overflow:auto;display:none;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
#list.open{display:block}
#list .row{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;font-size:15px}
#list .row:hover{background:var(--line)}
#list .row img,#list .row i{width:20px;height:20px;border-radius:3px;flex:none;image-rendering:pixelated;background:var(--line)}
#list .row small{margin-left:auto;color:var(--muted);font-size:12px}
#list .empty{padding:10px;color:var(--muted);font-size:14px}

/* town popup */
#pop{position:fixed;left:0;top:0;z-index:12;width:max-content;min-width:200px;max-width:min(340px,calc(100vw - 32px));padding:16px 20px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;font-size:15px;line-height:1.5;color:#dcd7e6;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:auto}
#pop[hidden]{display:none}
#pop::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;margin-left:-6px;background:inherit;border:inherit;border-width:0 1px 1px 0;transform:rotate(45deg)}
#pop h4{font-size:17px;font-weight:700;color:var(--text);margin:0 24px 6px 0;line-height:1.3}
#pop .nat{font-weight:500;color:#ff7fc2}
#pop .board{margin:-2px 0 8px;font-style:italic;color:var(--muted)}
#pop .row{margin:2px 0}
#pop b{color:var(--text);font-weight:700}
#pop details{margin-top:2px}
#pop summary{cursor:pointer;list-style-position:inside}
#pop .res{margin-top:6px;font-size:14px;color:var(--muted)}
#pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#pop .x{position:absolute;top:10px;right:12px;background:none;border:0;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
#pop .x:hover{color:var(--text)}

#status{position:fixed;left:clamp(12px,2.4vw,32px);bottom:calc(52px + env(safe-area-inset-bottom));z-index:6;font-size:13px;color:var(--muted);pointer-events:none}
#coords{position:fixed;left:clamp(12px,2.4vw,32px);bottom:calc(24px + env(safe-area-inset-bottom));z-index:6;padding:4px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);pointer-events:none;white-space:pre}
#coords:empty{display:none}
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--bg);font-family:"Minecraft",system-ui,sans-serif;font-size:clamp(18px,3vw,28px);letter-spacing:.04em;color:var(--gold);text-transform:uppercase;transition:opacity .7s ease}
#loading.done{opacity:0;pointer-events:none}
#loading.err{color:#ff6b6b;text-align:center;padding:24px}

@media(max-width:800px){
  :root{--navh:60px}
  nav .wrap{gap:12px}
  .brand img{height:34px}
  .links{display:none}
  .btn{height:34px;font-size:16px;padding:.2em 16px 0;border-radius:10px}
  #list{left:12px;right:12px;width:auto}
  .burger{display:flex}
  #scrim,#drawer{display:block}
  #online,#ip{display:none}
  .btn.store{display:inline-flex}
  #layersBtn,#panel{top:auto;right:auto;left:12px;bottom:calc(24px + env(safe-area-inset-bottom))}
  #status{bottom:auto;top:calc(var(--top) + 44px)}
  #coords{bottom:auto;top:calc(var(--top) + 12px)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</button>

  <div class="ph"><b>Map</b><button id="panelX" type="button" aria-label="Close">&times;</button></div>
  <label class="tg"><input type="checkbox" id="tPlayers" checked><i></i><span>Players</span><em id="pCount">0</em></label>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;background:#05050a;color:#fff;z-index:50">This map needs JavaScript.</p></noscript>

<script type="module">
import * as THREE from "./three.module.min.js";

/* ------------------------------------------------------------------
   SETTINGS
------------------------------------------------------------------ */
const CONFIG = {
  map: "https://legacymap.jes.earth",  // Dynmap (needs HTTPS and Access-Control-Allow-Origin: *)
  world: "Earth",
  mapName: "flat",               // Dynmap map prefix
  base: "earth.jpg",             // whole world in one image, made with stitch.html
  baseZoom: 6,                   // Dynmap zoom that image was built from. Live tiles take over below it
  worldWidth: 123120,            // blocks around the equator (the JES map is 342 blocks per degree)
  playerRefresh: 2000,           // ms
  markerRefresh: 60000,          // ms
  heads: "https://crafthead.net/helm/{name}/32",
  ip: "jes.earth",
};
/* ------------------------------------------------------------------ */

const $ = (s) => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const loading = $("#loading"), statusEl = $("#status");
const RB = CONFIG.worldWidth / (2 * Math.PI);             // blocks per radian
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const store = (() => { try { return JSON.parse(localStorage.getItem("jesmap") || "{}"); } catch (e) { return {}; } })();
const save = () => { try { localStorage.setItem("jesmap", JSON.stringify(store)); } catch (e) {} };

/* ---------- renderer ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $("#c"), antialias: true, powerPreference: "high-performance" });
} catch (e) {
  loading.className = "err"; loading.textContent = "Your browser could not start WebGL, so the map can't be shown.";
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setClearColor(0x05050a, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 200);
const canvas = renderer.domElement;

/* ---------- shared shader code ----------
   Every map layer gets (lon, lat) per vertex and is placed in the shader, so the
   globe can unroll into the flat map (uFlat 0..1) around the point in view. */
const U = {
  uFlat: { value: 0 }, uC: { value: new THREE.Vector2() },
  uP: { value: new THREE.Vector3() }, uE: { value: new THREE.Vector3() }, uN: { value: new THREE.Vector3() },
  uShade: { value: 1 }, uChunks: { value: 0 }, uRB: { value: RB },
  uL: { value: new THREE.Vector3(0, 0, 1) },              // sunlight, kept at the top left of the screen
  // the end of the world (see doomsday below): impact point, how far the cracks reach, shock wave, glow
  uImpact: { value: new THREE.Vector3(0, 0, 1) }, uBurn: { value: 0 }, uWave: { value: 0 }, uGlow: { value: 1 },
};
const SUN = new THREE.Vector3(-0.55, 0.6, 0.6).normalize(); // in screen space: left, up, towards the viewer
const GL = `
  uniform float uFlat, uShade, uChunks, uRB; uniform vec2 uC; uniform vec3 uP, uE, uN, uL;
  vec3 sph(vec2 ll){ float c = cos(ll.y); return vec3(c*sin(ll.x), sin(ll.y), c*cos(ll.x)); }
  vec3 place(vec2 ll){ return mix(sph(ll), uP + uE*(ll.x-uC.x) + uN*(ll.y-uC.y), uFlat); }
`;
const GL_FRAG = GL + `
  vec3 chunkGrid(vec3 col, vec2 ll){
    if (uChunks <= 0.0) return col;
    vec2 b = vec2(ll.x, -ll.y) * uRB / 16.0;
    vec2 g = abs(fract(b - 0.5) - 0.5) / fwidth(b);
    return mix(col, vec3(0.0), (1.0 - min(min(g.x, g.y), 1.0)) * 0.5 * uChunks);
  }
  vec3 shade(vec3 col, vec3 wp, vec2 ll){
    if (uShade <= 0.0) return col;
    vec3 n = sph(ll);
    float ndv = clamp(dot(n, normalize(cameraPosition - wp)), 0.0, 1.0);
    float sun = max(dot(n, uL), 0.0);
    vec3 s = col * (0.22 + 0.9 * pow(sun, 0.8));                                         // day side to night side
    s += vec3(0.25, 0.5, 1.0) * pow(1.0 - ndv, 3.5) * (0.08 + 0.55 * sun);              // thin haze on the lit edge
    return mix(col, s, uShade);
  }
  // cracks are the edges of a 3D Voronoi pattern; the same cells are used to break the planet apart
  uniform vec3 uImpact; uniform float uBurn, uWave, uGlow;
  vec3 cellHash(vec3 c){
    uvec3 v = uvec3(ivec3(c) + 1000);
    v = v * 1664525u + 1013904223u;
    v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
    v ^= v >> 16u;
    v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
    return vec3(v) / 4294967295.0;
  }
  vec2 vor(vec3 p){
    vec3 i = floor(p); float f1 = 9.0, f2 = 9.0;
    for (int x = -1; x <= 1; x++) for (int y = -1; y <= 1; y++) for (int z = -1; z <= 1; z++) {
      vec3 c = i + vec3(x, y, z); float d = length(c + cellHash(c) - p);
      if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
    }
    return vec2(f1, f2);
  }
  vec3 doom(vec3 col, vec3 d){
    if (uBurn <= 0.0 && uWave <= 0.0) return col;
    float ang = acos(clamp(dot(d, uImpact), -1.0, 1.0));
    if (uWave > 0.0) col += vec3(1.0, 0.72, 0.4) * exp(-pow((ang - uWave) / 0.05, 2.0)) * max(0.0, 1.0 - uWave / 3.2) * 1.6;
    float reach = smoothstep(-0.12, 0.08, uBurn - ang);
    if (reach <= 0.0) return col;
    vec2 big = vor(d * 3.2), small = vor(d * 9.0);
    float e1 = 1.0 - smoothstep(0.0, 0.06, big.y - big.x), e2 = 1.0 - smoothstep(0.0, 0.05, small.y - small.x);
    col = mix(col, col * vec3(0.66, 0.36, 0.28), reach * 0.75);                       // scorched
    col += vec3(1.0, 0.42, 0.08) * (e1 * 2.2 + e2 * 0.7) * reach * uGlow;               // molten cracks
    col += vec3(1.0, 0.55, 0.15) * smoothstep(0.45, 0.0, ang) * reach * 0.9 * uGlow;    // glowing crater
    return col;
  }
`;
const MAP_VS = GL + `
  attribute vec2 ll; varying vec2 vLL; varying vec2 vUv; varying vec3 vW;
  void main(){ vLL = ll; vUv = uv; vec3 p = place(ll); vW = p; gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0); }`;
const BASE_FS = GL_FRAG + `
  uniform sampler2D uTex; varying vec2 vLL; varying vec2 vUv; varying vec3 vW;
  void main(){ gl_FragColor = vec4(doom(shade(chunkGrid(texture2D(uTex, vUv).rgb, vLL), vW, vLL), sph(vLL)), 1.0); }`;
const TILE_FS = GL_FRAG + `
  uniform sampler2D uTex; varying vec2 vLL; varying vec2 vUv; varying vec3 vW;
  void main(){
    vec3 c = texture2D(uTex, vUv).rgb;
    if (c.r + c.g + c.b < 0.04) discard;          // unrendered parts of a tile are black: let the layer below show
    gl_FragColor = vec4(shade(chunkGrid(c, vLL), vW, vLL), 1.0);
  }`;

/* lon/lat grid; uv runs 0..1 over the patch with v = 1 at the north edge */
function gridGeo(lon0, lon1, lat0, lat1, nx, ny) {
  const n = (nx + 1) * (ny + 1), ll = new Float32Array(n * 2), uv = new Float32Array(n * 2), pos = new Float32Array(n * 3), idx = [];
  for (let j = 0, k = 0; j <= ny; j++) for (let i = 0; i <= nx; i++, k++) {
    const lon = lon0 + (lon1 - lon0) * i / nx, lat = lat0 + (lat1 - lat0) * j / ny, c = Math.cos(lat);
    ll[k * 2] = lon; ll[k * 2 + 1] = lat; uv[k * 2] = i / nx; uv[k * 2 + 1] = j / ny;
    pos[k * 3] = c * Math.sin(lon); pos[k * 3 + 1] = Math.sin(lat); pos[k * 3 + 2] = c * Math.cos(lon);
  }
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const a = j * (nx + 1) + i, b = a + 1, c = a + nx + 2, d = a + nx + 1;
    idx.push(a, b, c, a, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("ll", new THREE.BufferAttribute(ll, 2));
  g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}
const mapMaterial = (fs, tex, extra = {}) => new THREE.ShaderMaterial({ uniforms: { ...U, uTex: { value: tex } }, vertexShader: MAP_VS, fragmentShader: fs, ...extra });

/* ---------- globe ---------- */
const baseMat = mapMaterial(BASE_FS, null);
const base = new THREE.Mesh(gridGeo(-Math.PI, Math.PI, -Math.PI / 2, Math.PI / 2, 360, 180), baseMat);
base.frustumCulled = false; base.renderOrder = 1;
scene.add(base);

const atmoMat = new THREE.ShaderMaterial({
  uniforms: { uA: { value: 1 } },
  side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  vertexShader: `varying vec3 vN; void main(){ vN = normalize(normalMatrix*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform float uA, uRed; uniform vec3 uSun; varying vec3 vN;
    void main(){
      vec3 n = normalize(vN);
      float i = pow(clamp((0.26 - n.z) / 0.36, 0.0, 1.0), 2.0);   // strongest at the globe's edge, gone at the outside
      float lit = clamp(dot(normalize(n.xy + 1e-5), normalize(uSun.xy)) * 0.5 + 0.5, 0.0, 1.0);
      gl_FragColor = vec4(mix(vec3(0.3,0.55,1.0), vec3(1.0,0.32,0.12), uRed), 1.0) * i * mix(0.06 + uRed * 0.5, 0.75 + uRed * 0.4, lit * lit) * uA;
    }`,
});
atmoMat.uniforms.uSun = { value: SUN }; atmoMat.uniforms.uRed = { value: 0 };
const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.06, 96, 64), atmoMat);
atmo.renderOrder = 2; scene.add(atmo);

/* soft clouds drifting east, lit by the sun, with a faint shadow underneath. Only seen from far away */
const cloudO = { value: 0 }, cloudT = { value: 0 };
const cloudLayer = (r, shadow) => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 192, 96), new THREE.ShaderMaterial({
    uniforms: { uO: cloudO, uT: cloudT, uL: U.uL, uShadow: { value: shadow ? 1 : 0 } }, transparent: true, depthWrite: false,
    vertexShader: `varying vec3 vP; varying vec3 vW;
      void main(){ vP = normalize(position); vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `uniform float uO, uT, uShadow; uniform vec3 uL; varying vec3 vP; varying vec3 vW;
      float h(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
      float vn(vec3 x){
        vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(mix(h(i), h(i + vec3(1,0,0)), f.x), mix(h(i + vec3(0,1,0)), h(i + vec3(1,1,0)), f.x), f.y),
                   mix(mix(h(i + vec3(0,0,1)), h(i + vec3(1,0,1)), f.x), mix(h(i + vec3(0,1,1)), h(i + vec3(1,1,1)), f.x), f.y), f.z);
      }
      float fbm(vec3 p, int o){ float a = 0.5, s = 0.0; for (int i = 0; i < 7; i++){ if (i >= o) break; s += a * vn(p); p = p * 2.02 + vec3(3.1, 1.7, 5.3); a *= 0.5; } return s; }
      float density(vec3 d){
        float a = uT * 0.0025, ca = cos(a), sa = sin(a);   // drift east
        vec3 p = vec3(ca * d.x - sa * d.z, d.y, sa * d.x + ca * d.z) * 3.4;
        vec3 w = vec3(fbm(p + 1.3, 4), fbm(p + vec3(5.2, 1.1, 2.8), 4), 0.0);
        float n = fbm(p * 1.7 + w.xyx * 2.2, uShadow > 0.5 ? 4 : 7);
        float band = mix(0.85, 1.12, smoothstep(0.2, 0.6, abs(d.y)));   // fewer over the subtropics, more further north
        return smoothstep(0.5, 0.78, n * band);
      }
      void main(){
        vec3 d = vP;
        if (uShadow > 0.5) d = normalize(d - (uL - dot(uL, d) * d) * 0.012);   // shadow falls away from the sun
        float c = density(d);
        if (c < 0.01) discard;
        float sun = max(dot(vP, uL), 0.0);
        float ndv = clamp(dot(vP, normalize(cameraPosition - vW)), 0.0, 1.0);
        float edge = smoothstep(0.0, 0.35, ndv);           // thin out towards the edge of the globe
        if (uShadow > 0.5) { gl_FragColor = vec4(0.0, 0.02, 0.06, c * 0.28 * uO * edge); return; }
        vec3 col = mix(vec3(0.58, 0.64, 0.74), vec3(1.0), smoothstep(0.2, 0.9, c)) * (0.28 + 0.85 * pow(sun, 0.7));
        gl_FragColor = vec4(col, c * 0.9 * uO * edge);
      }`,
  }));
  m.renderOrder = shadow ? 58 : 59; scene.add(m); return m;
};
const clouds = [cloudLayer(1.0015, true), cloudLayer(1.008, false)];

/* ---------- landmarks, animals and birds: little pixel-art figures at their real places ---------- */
const PAL = { k: "#2a2230", w: "#f4f1ec", g: "#a9a4a0", s: "#8d96a3", y: "#f3d27a", Y: "#c9a24c", b: "#6e5233", d: "#3b2a20",
  t: "#cdb27a", T: "#c39a6b", G: "#5fa58c", o: "#d0632f", r: "#6a2a16", p: "#f2a1c0", P: "#d8608f", R: "#c8352c", c: "#c99a5a", n: "#f7f5f0",
  F: "#5b6f9a", Q: "#3d6fd1", S: "#c99b74", h: "#3b2a1d", C: "#3aa7a3", B: "#3c3a8f", x: "#555560", e: "#9a9cb8", E: "#5e5f78", M: "#4f8a3a" };
const ART = {
  eiffel: [".....b.....", ".....b.....", "....bbb....", "....b.b....", "....bbb....", "....b.b....", "...bbbbb...", "...b...b...",
    "...bb.bb...", "..bbbbbbb..", "..b.....b..", "..b.....b..", ".bb.....bb.", ".b..bbb..b.", "bb.b...b.bb", "b..b...b..b"],
  empire: ["....s....", "....s....", "...sss...", "...sys...", "..sssss..", "..sysys..", "..sssss..", ".sssssss.", ".sysysys.",
    ".sssssss.", ".sysysys.", ".sssssss.", ".sysysys.", ".sssssss.", ".sysysys.", ".sssssss."],

// a player gliding with an elytra, holding a firework, facing right
const FLYER = ["......eeeeeee........", "....eeEEEEEEEe.......", "xxBBBBBBCCCCCChhhh...", "xxBBBBBBCCCCCCShSS...",
  "xxBBBBBBCCCCCCSSSS...", ".........SSSSSSSRRRwy"];

  flyer.a += dt * 0.11;
  const flyAt = (a) => {
    const d = flyer.u.clone().multiplyScalar(Math.cos(a)).addScaledVector(flyer.v, Math.sin(a));
    const lat = Math.asin(clamp(d.y, -1, 1)), lon = Math.atan2(d.x, d.z);
    if (isFlat()) return screenPos(lon, lat);
    const P = d.multiplyScalar(1.035), cam = camera.position, dd = P.clone().sub(cam);
    const tc = -cam.dot(dd) / dd.lengthSq();
    if (tc > 0 && tc < 1 && cam.clone().addScaledVector(dd, tc).length() < 1) return null;   // the planet is in the way
    sp.copy(P).project(camera);
    if (sp.z > 1 || Math.abs(sp.x) > 1.2 || Math.abs(sp.y) > 1.2) return null;
    return [(sp.x * .5 + .5) * innerWidth, (-sp.y * .5 + .5) * innerHeight, 1, false];
  };
  const fp = sf ? flyAt(flyer.a) : null, fq = fp && flyAt(flyer.a + 0.004);
  if (!fp || !fq) placeEl(flyer.el, null);
  else {
    let ang = Math.atan2(fq[1] - fp[1], fq[0] - fp[0]) * 180 / Math.PI;
    const flip = Math.abs(ang) > 90 ? " scaleY(-1)" : "";
    fp[2] = sf; placeEl(flyer.el, fp, ` rotate(${ang.toFixed(1)}deg)${flip}`);
  }
  flyer.sparks.forEach((s, i) => {
    const p = fp ? flyAt(flyer.a - 0.006 - i * 0.0055) : null;
    if (!p) { placeEl(s, null); return; }
    p[2] = sf * (1 - i / flyer.sparks.length) * (0.55 + 0.45 * Math.random());     // twinkle
    p[0] += (Math.random() - 0.5) * 3; p[1] += (Math.random() - 0.5) * 3;
    placeEl(s, p, ` scale(${(1.3 - i * 0.05).toFixed(2)})`);
  });
  if (sign.el) {
    const p = screenPos(sign.lon, sign.lat);
    if (!p || p[3]) placeEl(sign.el, null);
    else { placeEl(sign.el, p, " translateY(-50%)"); sign.el.firstChild.style.transform = `scale(${clamp(1.25 - view.h * 0.22, 0.45, 1.1).toFixed(2)})`; }
  }
  if (popAt) {
    const s = screenPos(popAt.lon, popAt.lat);
    if (!s) pop.style.visibility = "hidden";
    else { pop.style.visibility = "visible"; pop.style.transform = `translate3d(${s[0].toFixed(1)}px,${s[1].toFixed(1)}px,0) translate(-50%, calc(-100% - 12px))`; }
  }
  saveHash();
}
// keep tiles coming in after the view settles
setInterval(() => { if (tilesDirty) dirty = true; }, 150);
requestAnimationFrame(frame);
</script>
</body>
</html>
