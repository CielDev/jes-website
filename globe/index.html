<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Map | Just an Earth Server</title>
<meta name="description" content="The Just an Earth Server live map: a 3D globe and flat map with towns, claims and live player positions.">
<link rel="icon" type="image/png" href="../img/favicon.png">
<style>
@font-face{font-family:"Minecraft";src:url("../fonts/MinecraftClassic-Bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}
:root{--bg:#05050a;--bg2:#15121d;--panel:rgba(21,18,29,.94);--line:#2a2536;--text:#f3f0f7;--muted:#a39db3;--pink:#E43A96;--gold:#FCD05C;--grad:linear-gradient(90deg,var(--pink),var(--gold));--navh:60px;--top:var(--navh)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}

/* top bar, same look as the main site */
nav{position:fixed;top:0;left:0;right:0;z-index:20;height:var(--navh);display:flex;align-items:center;gap:22px;padding:0 clamp(12px,2.4vw,32px);background:rgba(13,11,18,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:transform .3s}
body.nonav nav{transform:translateY(-100%)}
body.nonav{--top:0px}
.brand img{height:38px;width:auto;display:block}
.links{display:flex;gap:22px;font-size:16px;color:var(--muted)}
.links a:hover{color:var(--text)}
.links a.on{color:var(--pink)}
.right{margin-left:auto;display:flex;align-items:center;gap:18px}
#online{background:none;border:0;cursor:pointer;color:var(--muted);font-size:16px;padding:8px 4px}
#online:hover{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:.2em 22px 0;border:0;border-radius:12px;background:var(--grad);color:#1a1020;font-family:"Minecraft",system-ui,sans-serif;font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;line-height:1;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3);transition:transform .15s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}

/* map */
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing}
#markers{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#markers>div{position:absolute;left:0;top:0;will-change:transform}

/* players: just a head from far away, a name plate up close */
.pl{display:flex;align-items:center;gap:5px;transform-origin:0 0;pointer-events:auto;cursor:pointer;white-space:nowrap;z-index:2}
.pl img,.pl i{width:18px;height:18px;flex:none;display:block;image-rendering:pixelated;border-radius:2px;background:var(--line);box-shadow:0 1px 4px rgba(0,0,0,.6)}
.pl span{display:none;font-size:12.5px;font-weight:600;line-height:1}
.pl.near{padding:3px 7px 3px 3px;border-radius:4px;background:rgba(13,11,18,.86);border:1px solid rgba(255,255,255,.08)}
.pl.near img,.pl.near i{width:16px;height:16px;box-shadow:none}
.pl.near span{display:block}
.pl:hover{z-index:3}

/* towns */
.tw{display:flex;align-items:center;gap:4px;pointer-events:auto;cursor:pointer;z-index:1}
.tw svg{width:14px;height:14px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
.tw b{display:block;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.tw span{display:none;font-size:12px;font-weight:600;text-shadow:0 1px 2px #000,0 0 4px #000}
.tw.near span{display:block}
.tw.dot:not(.near){display:none}

/* controls, top right and bottom right */
.ctl{position:fixed;right:clamp(12px,2.4vw,32px);z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#layersBtn{top:calc(var(--top) + 16px);width:44px;height:44px;display:grid;place-items:center;cursor:pointer;transition:top .3s}
#layersBtn[hidden]{display:none}
#layersBtn svg{width:20px;height:20px}
#layersBtn:hover,#zoom button:hover{background:var(--line)}
#panel{top:calc(var(--top) + 16px);width:200px;padding:12px;transition:top .3s}
#panel[hidden]{display:none}
.ph{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px 2px;font-size:14px}
.ph button{background:none;border:0;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px}
.ph button:hover{color:var(--text)}
.tg{display:flex;align-items:center;gap:10px;padding:7px 2px;font-size:14px;cursor:pointer;user-select:none}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg i{position:relative;width:32px;height:18px;flex:none;border-radius:9px;background:#3a3446;transition:background .2s}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.tg input:checked+i{background:var(--pink)}
.tg input:checked+i::after{transform:translateX(14px)}
.tg input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}
.tg em{margin-left:auto;font-style:normal;color:var(--muted);font-size:13px}
#zoom{bottom:calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}
#zoom button{width:44px;height:42px;border:0;background:none;cursor:pointer;font-size:20px;line-height:1}
#zoom button+button{border-top:1px solid var(--line)}

/* player list */
#list{position:fixed;top:calc(var(--top) + 8px);right:clamp(12px,2.4vw,32px);z-index:16;width:240px;max-height:min(60vh,460px);overflow:auto;display:none;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
#list.open{display:block}
#list .row{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;font-size:15px}
#list .row:hover{background:var(--line)}
#list .row img,#list .row i{width:20px;height:20px;border-radius:3px;flex:none;image-rendering:pixelated;background:var(--line)}
#list .row small{margin-left:auto;color:var(--muted);font-size:12px}
#list .empty{padding:10px;color:var(--muted);font-size:14px}

/* town popup */
#pop{position:fixed;left:0;top:0;z-index:12;width:max-content;max-width:min(280px,calc(100vw - 32px));padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:13px;line-height:1.45;color:var(--muted);box-shadow:0 8px 24px rgba(0,0,0,.45);pointer-events:auto}
#pop[hidden]{display:none}
#pop::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;margin-left:-6px;background:inherit;border:inherit;border-width:0 1px 1px 0;transform:rotate(45deg)}
#pop h4{font-size:15px;color:var(--text);margin:0 22px 4px 0}
#pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#pop b{color:var(--text);font-weight:600}
#pop .x{position:absolute;top:6px;right:8px;background:none;border:0;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}

#status{position:fixed;left:clamp(12px,2.4vw,32px);bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;font-size:13px;color:var(--muted);pointer-events:none}
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--bg);font-family:"Minecraft",system-ui,sans-serif;font-size:clamp(18px,3vw,28px);letter-spacing:.04em;color:var(--gold);text-transform:uppercase;transition:opacity .7s ease}
#loading.done{opacity:0;pointer-events:none}
#loading.err{color:#ff6b6b;text-align:center;padding:24px}

@media(max-width:800px){
  :root{--navh:54px}
  nav{gap:12px}
  .brand img{height:32px}
  .links{display:none}
  .btn{height:34px;font-size:15px;padding:.2em 14px 0;border-radius:10px}
  #list{left:12px;right:12px;width:auto}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<nav>
  <a class="brand" href="../"><img src="../img/logo.png" alt="Just an Earth Server"></a>
  <div class="links">
    <a href="../">Home</a>
    <a href="../#towny">How it works</a>
    <a href="https://store.jes.earth">Store</a>
    <a class="on" href="./">Map</a>
  </div>
  <div class="right">
    <button id="online" type="button" aria-haspopup="true" aria-expanded="false">0 online</button>
    <button class="btn" id="ip" type="button">Play Now</button>
  </div>
</nav>

<canvas id="c" aria-label="Map of the Just an Earth Server world"></canvas>
<div id="markers"></div>
<div id="pop" hidden></div>
<div id="list" role="menu"></div>

<button class="ctl" id="layersBtn" type="button" aria-label="Map layers" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="m2 13 10 5 10-5"/></svg>
</button>
<div class="ctl" id="panel" hidden>
  <div class="ph"><b>Map</b><button id="panelX" type="button" aria-label="Close">&times;</button></div>
  <label class="tg"><input type="checkbox" id="tPlayers" checked><i></i><span>Players</span><em id="pCount">0</em></label>
  <label class="tg"><input type="checkbox" id="tClaims" checked><i></i><span>Claims</span></label>
  <label class="tg"><input type="checkbox" id="tChunks"><i></i><span>Chunks</span></label>
  <label class="tg"><input type="checkbox" id="tFlat"><i></i><span>Flat map</span></label>
  <label class="tg"><input type="checkbox" id="tNav"><i></i><span>Hide menu</span></label>
</div>
<div class="ctl" id="zoom"><button id="zin" type="button" aria-label="Zoom in">+</button><button id="zout" type="button" aria-label="Zoom out">&minus;</button></div>
<div id="status"></div>
<div id="loading">Loading the world...</div>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;background:#05050a;color:#fff;z-index:50">This map needs JavaScript.</p></noscript>

<script type="module">
import * as THREE from "./three.module.min.js";

/* ------------------------------------------------------------------
   SETTINGS
------------------------------------------------------------------ */
const CONFIG = {
  map: "https://map.jes.earth",  // Dynmap (needs HTTPS and Access-Control-Allow-Origin: *)
  world: "Earth",
  mapName: "flat",               // Dynmap map prefix
  base: "earth.jpg",             // whole world in one image, made with stitch.html
  baseZoom: 6,                   // Dynmap zoom that image was built from. Live tiles take over below it
  worldWidth: 123120,            // blocks around the equator (the JES map is 342 blocks per degree)
  playerRefresh: 2000,           // ms
  markerRefresh: 60000,          // ms
  heads: "https://crafthead.net/helm/{name}/32",
  ip: "jes.earth",
};
/* ------------------------------------------------------------------ */

const $ = (s) => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const loading = $("#loading"), statusEl = $("#status");
const RB = CONFIG.worldWidth / (2 * Math.PI);             // blocks per radian
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const store = (() => { try { return JSON.parse(localStorage.getItem("jesmap") || "{}"); } catch (e) { return {}; } })();
const save = () => { try { localStorage.setItem("jesmap", JSON.stringify(store)); } catch (e) {} };

/* ---------- renderer ---------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $("#c"), antialias: true, powerPreference: "high-performance" });
} catch (e) {
  loading.className = "err"; loading.textContent = "Your browser could not start WebGL, so the map can't be shown.";
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setClearColor(0x05050a, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 200);
const canvas = renderer.domElement;

/* ---------- shared shader code ----------
   Every map layer gets (lon, lat) per vertex and is placed in the shader, so the
   globe can unroll into the flat map (uFlat 0..1) around the point in view. */
const U = {
  uFlat: { value: 0 }, uC: { value: new THREE.Vector2() },
  uP: { value: new THREE.Vector3() }, uE: { value: new THREE.Vector3() }, uN: { value: new THREE.Vector3() },
  uShade: { value: 1 }, uChunks: { value: 0 }, uRB: { value: RB },
};
const GL = `
  uniform float uFlat, uShade, uChunks, uRB; uniform vec2 uC; uniform vec3 uP, uE, uN;
  vec3 sph(vec2 ll){ float c = cos(ll.y); return vec3(c*sin(ll.x), sin(ll.y), c*cos(ll.x)); }
  vec3 place(vec2 ll){ return mix(sph(ll), uP + uE*(ll.x-uC.x) + uN*(ll.y-uC.y), uFlat); }
`;
const GL_FRAG = GL + `
  vec3 chunkGrid(vec3 col, vec2 ll){
    if (uChunks <= 0.0) return col;
    vec2 b = vec2(ll.x, -ll.y) * uRB / 16.0;
    vec2 g = abs(fract(b - 0.5) - 0.5) / fwidth(b);
    return mix(col, vec3(0.0), (1.0 - min(min(g.x, g.y), 1.0)) * 0.5 * uChunks);
  }
  vec3 shade(vec3 col, vec3 wp, vec2 ll){
    if (uShade <= 0.0) return col;
    float ndv = clamp(dot(sph(ll), normalize(cameraPosition - wp)), 0.0, 1.0);
    vec3 s = col * mix(0.5, 1.0, pow(ndv, 0.45)) + vec3(0.10,0.28,0.85) * pow(1.0-ndv, 3.0) * 0.55;
    return mix(col, s, uShade);
  }
`;
const MAP_VS = GL + `
  attribute vec2 ll; varying vec2 vLL; varying vec2 vUv; varying vec3 vW;
  void main(){ vLL = ll; vUv = uv; vec3 p = place(ll); vW = p; gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0); }`;
const BASE_FS = GL_FRAG + `
  uniform sampler2D uTex; varying vec2 vLL; varying vec2 vUv; varying vec3 vW;
  void main(){ gl_FragColor = vec4(shade(chunkGrid(texture2D(uTex, vUv).rgb, vLL), vW, vLL), 1.0); }`;
const TILE_FS = GL_FRAG + `
  uniform sampler2D uTex; varying vec2 vLL; varying vec2 vUv; varying vec3 vW;
  void main(){
    vec3 c = texture2D(uTex, vUv).rgb;
    if (c.r + c.g + c.b < 0.04) discard;          // unrendered parts of a tile are black: let the layer below show
    gl_FragColor = vec4(shade(chunkGrid(c, vLL), vW, vLL), 1.0);
  }`;

/* lon/lat grid; uv runs 0..1 over the patch with v = 1 at the north edge */
function gridGeo(lon0, lon1, lat0, lat1, nx, ny) {
  const n = (nx + 1) * (ny + 1), ll = new Float32Array(n * 2), uv = new Float32Array(n * 2), pos = new Float32Array(n * 3), idx = [];
  for (let j = 0, k = 0; j <= ny; j++) for (let i = 0; i <= nx; i++, k++) {
    const lon = lon0 + (lon1 - lon0) * i / nx, lat = lat0 + (lat1 - lat0) * j / ny, c = Math.cos(lat);
    ll[k * 2] = lon; ll[k * 2 + 1] = lat; uv[k * 2] = i / nx; uv[k * 2 + 1] = j / ny;
    pos[k * 3] = c * Math.sin(lon); pos[k * 3 + 1] = Math.sin(lat); pos[k * 3 + 2] = c * Math.cos(lon);
  }
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const a = j * (nx + 1) + i, b = a + 1, c = a + nx + 2, d = a + nx + 1;
    idx.push(a, b, c, a, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("ll", new THREE.BufferAttribute(ll, 2));
  g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}
const mapMaterial = (fs, tex, extra = {}) => new THREE.ShaderMaterial({ uniforms: { ...U, uTex: { value: tex } }, vertexShader: MAP_VS, fragmentShader: fs, ...extra });

/* ---------- globe ---------- */
const baseMat = mapMaterial(BASE_FS, null);
const base = new THREE.Mesh(gridGeo(-Math.PI, Math.PI, -Math.PI / 2, Math.PI / 2, 360, 180), baseMat);
base.frustumCulled = false; base.renderOrder = 1;
scene.add(base);

const atmoMat = new THREE.ShaderMaterial({
  uniforms: { uA: { value: 1 } },
  side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  vertexShader: `varying vec3 vN; void main(){ vN = normalize(normalMatrix*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform float uA; varying vec3 vN; void main(){ float i = pow(max(0.0, 0.62 - dot(vN, vec3(0.0,0.0,1.0))), 3.2); gl_FragColor = vec4(0.22,0.5,1.0,1.0)*i*1.15*uA; }`,
});
const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.13, 96, 64), atmoMat);
atmo.renderOrder = 2; scene.add(atmo);

const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.4, sizeAttenuation: false, transparent: true, opacity: .75, depthWrite: false });
{
  const n = 1400, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u), r = 90;
    pos.set([r * s * Math.cos(t), r * u, r * s * Math.sin(t)], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const stars = new THREE.Points(g, starMat); stars.renderOrder = 0; scene.add(stars);
}

new THREE.TextureLoader().load(
  CONFIG.base,
  (tex) => {
    tex.generateMipmaps = true; tex.minFilter = THREE.LinearMipmapLinearFilter; tex.magFilter = THREE.LinearFilter;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    baseMat.uniforms.uTex.value = tex; dirty = true;
    requestAnimationFrame(() => requestAnimationFrame(() => loading.classList.add("done")));
  },
  undefined,
  () => { loading.className = "err"; loading.textContent = "Could not load the map image (" + CONFIG.base + ")."; }
);

/* ---------- camera ----------
   The camera always looks straight down at (view.lon, view.lat) from height view.h */
const view = { lon: 0.17, lat: 0.5, h: 3.2 };
const H_MIN = 0.012, H_MAX = 6;
const C = new THREE.Vector3(), E = new THREE.Vector3(), N = new THREE.Vector3();
let dirty = true, tilesDirty = true, lastInput = -1e9, tween = null, zoomAnim = null, flatAnim = null;
const isFlat = () => U.uFlat.value > 0.5;
const clampH = (v) => clamp(v, H_MIN, H_MAX);
const clampView = () => {
  if (isFlat()) { view.lon = clamp(view.lon, -Math.PI, Math.PI); view.lat = clamp(view.lat, -Math.PI / 2, Math.PI / 2); }
  else { view.lon = wrap(view.lon); view.lat = clamp(view.lat, -1.5, 1.5); }
};
function updateCamera() {
  const cl = Math.cos(view.lat), sl = Math.sin(view.lat), co = Math.cos(view.lon), so = Math.sin(view.lon);
  C.set(cl * so, sl, cl * co); E.set(co, 0, -so); N.set(-sl * so, cl, -sl * co);
  U.uC.value.set(view.lon, view.lat); U.uP.value.copy(C); U.uE.value.copy(E); U.uN.value.copy(N);
  camera.position.copy(C).multiplyScalar(1 + view.h);
  camera.up.copy(N); camera.lookAt(C);
  camera.near = view.h * 0.1; camera.updateProjectionMatrix(); camera.updateMatrixWorld();
}
const radPerPx = () => 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * view.h / innerHeight;

/* screen point -> {lon, lat} on the globe or flat map */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hit = new THREE.Vector3();
function pick(cx, cy) {
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const o = ray.ray.origin, d = ray.ray.direction;
  if (!isFlat()) {
    const b = o.dot(d), disc = b * b - (o.lengthSq() - 1);
    if (disc < 0) return null;
    hit.copy(d).multiplyScalar(-b - Math.sqrt(disc)).add(o);
    return { lon: Math.atan2(hit.x, hit.z), lat: Math.asin(clamp(hit.y, -1, 1)) };
  }
  const dn = d.dot(C); if (dn >= 0) return null;
  hit.copy(d).multiplyScalar((1 - o.dot(C)) / dn).add(o).sub(C);
  return { lon: view.lon + hit.dot(E), lat: view.lat + hit.dot(N) };
}
/* {lon, lat} -> world position, the same as place() in the shaders */
function place(lon, lat, out) {
  const c = Math.cos(lat), f = U.uFlat.value;
  out.set(c * Math.sin(lon), Math.sin(lat), c * Math.cos(lon));
  if (f > 0) out.lerp(hit.copy(C).addScaledVector(E, lon - view.lon).addScaledVector(N, lat - view.lat), f);
  return out;
}

/* ---------- controls ---------- */
const vel = { lon: 0, lat: 0 };
const ptrs = new Map();
let pinch = null, lastMove = 0, down = null;
function panBy(dx, dy) {
  const k = radPerPx();
  const lonK = isFlat() ? 1 : 1 + (1 / Math.max(Math.cos(view.lat), 0.2) - 1) * clamp((1.2 - view.h) / 1.0, 0, 1);
  view.lon -= dx * k * lonK; view.lat += dy * k; clampView();
  return [-dx * k * lonK, dy * k];
}
function zoomAt(factor, cx, cy) {
  const a = cx == null ? null : pick(cx, cy);
  view.h = clampH(view.h * factor); updateCamera();
  const b = a && view.h < 1.5 ? pick(cx, cy) : null;
  if (a && b) { view.lon += isFlat() ? a.lon - b.lon : wrap(a.lon - b.lon); view.lat += a.lat - b.lat; clampView(); }
  dirty = true;
}
const stopAnims = () => { tween = null; vel.lon = vel.lat = 0; lastInput = performance.now(); };

canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.classList.add("drag"); stopAnims(); zoomAnim = null;

    const k = Math.min(1, (now - tween.t0) / tween.dur), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    view.lon = tween.lon0 + (tween.lon1 - tween.lon0) * e; view.lat = tween.lat0 + (tween.lat1 - tween.lat0) * e;
    view.h = Math.exp(tween.h0 + (tween.h1 - tween.h0) * e);
    if (k >= 1) { tween = null; clampView(); } dirty = true;
  } else if (zoomAnim) {
    const lh = Math.log(view.h), lt = Math.log(zoomAnim.target), step = (lt - lh) * Math.min(1, dt * 14);
    zoomAt(Math.exp(Math.abs(lt - lh) < 0.002 ? lt - lh : step), zoomAnim.x, zoomAnim.y);
    if (Math.abs(lt - Math.log(view.h)) < 0.002) zoomAnim = null;
    lastInput = now;
  } else if (!ptrs.size) {
    if (Math.abs(vel.lon) + Math.abs(vel.lat) > 0.0005 * Math.min(1, view.h)) {    // inertia after a drag
      view.lon += vel.lon * dt; view.lat += vel.lat * dt; clampView();
      const f = Math.exp(-4 * dt); vel.lon *= f; vel.lat *= f; dirty = true;
    } else if (!reduce && !isFlat() && now - lastInput > 6000 && view.h > 2) {        // slow spin while idle
      view.lon = wrap(view.lon + 0.03 * dt); dirty = true;
    }
  }

  // smooth player movement between updates
  for (const p of players.values()) {
    if (!p.onMap) continue;
    const dl = wrap(p.tn - p.lon);
    if (Math.abs(dl) > 1e-7 || Math.abs(p.tl - p.lat) > 1e-7) { const f = Math.min(1, dt * 5); p.lon += dl * f; p.lat += (p.tl - p.lat) * f; dirty = true; }
  }
  if (!dirty) return;
  dirty = false; tilesDirty = true;

  updateCamera();
  const f = U.uFlat.value;
  U.uShade.value = (1 - f) * THREE.MathUtils.smoothstep(view.h, 0.2, 1.5);
  const bpp = RB * radPerPx();
  U.uChunks.value = $("#tChunks").checked ? THREE.MathUtils.smoothstep(8 - bpp, 0, 5) : 0;
  atmoMat.uniforms.uA.value = (1 - f) * THREE.MathUtils.smoothstep(view.h, 0.05, 0.5);
  atmo.visible = atmoMat.uniforms.uA.value > 0.001;
  starMat.opacity = .75 * (1 - f * 0.6);
  if (now - lastTiles > 90) { updateTiles(); lastTiles = now; tilesDirty = false; }
  renderer.render(scene, camera);

  // DOM markers
  const showP = $("#tPlayers").checked, near = view.h < 0.45;
  for (const p of players.values()) {
    if (!showP || !p.onMap) { placeEl(p.el, null); continue; }
    p.el.classList.toggle("near", near);
    placeEl(p.el, screenPos(p.lon, p.lat));
  }
  const showT = $("#tClaims").checked, labels = bpp < 12;
  for (const t of towns) {
    if (!showT) { placeEl(t.el, null); continue; }
    t.el.classList.toggle("near", labels);
    placeEl(t.el, screenPos(t.lon, t.lat), labels ? " translateX(calc(50% - 7px))" : "");
  }
  if (popAt) {
    const s = screenPos(popAt.lon, popAt.lat);
    if (!s) pop.style.visibility = "hidden";
    else { pop.style.visibility = "visible"; pop.style.transform = `translate3d(${s[0].toFixed(1)}px,${s[1].toFixed(1)}px,0) translate(-50%, calc(-100% - 12px))`; }
  }
  saveHash();
}
// keep tiles coming in after the view settles
setInterval(() => { if (tilesDirty) dirty = true; }, 150);
requestAnimationFrame(frame);
</script>
</body>
</html>
